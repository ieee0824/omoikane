services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: omoikane-dev
    working_dir: /workspace
    # 対話的に exec して使うため tty/stdin を有効化する。
    tty: true
    stdin_open: true
    # Codex のファイル編集サンドボックスが使用する user namespace を許可する。
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      # リポジトリをバインドマウントし、ソース編集をホストと共有する。
      - .:/workspace
      # ビルド成果物はホストの target/ と分離した専用ボリュームに置く（CARGO_TARGET_DIR=/target）。
      - cargo-target:/target
      # crates.io インデックス / crate ソース / git 依存を永続化し、毎回の再ダウンロードを避ける。
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      # Claude Code のログイン情報・設定を永続化する（CLAUDE_CONFIG_DIR）。
      - claude-config:/home/dev/.claude
      # Codex CLI のログイン情報と本体パッケージ（~/.codex = CODEX_HOME）を永続化する。
      # 更新はコンテナ内で codex update を実行する（README 参照）。
      - codex-config:/home/dev/.codex
      # コンテナ専用の SSH 鍵（~/.ssh）を永続化する。サンドボックスの隔離を保つため
      # ホストの ~/.ssh はマウントしない（鍵はコンテナ内で生成して個別に登録する）。
      - ssh-config:/home/dev/.ssh
    # コンテナを起動したままにして docker compose exec で入れるようにする。
    command: sleep infinity

volumes:
  cargo-target:
  cargo-registry:
  cargo-git:
  claude-config:
  codex-config:
  ssh-config:
