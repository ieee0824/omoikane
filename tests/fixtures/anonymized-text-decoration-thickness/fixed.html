<!doctype html>
<meta charset="utf-8">
<title>Text decoration thickness fixed fixture</title>
<style>
  html, body {
    margin: 0;
    width: 320px;
    height: 240px;
    overflow: hidden;
    background: white;
  }
  .case {
    position: absolute;
    color: transparent;
    font-family: sans-serif;
    line-height: 1;
    white-space: nowrap;
  }
  #nested {
    left: 12px;
    top: 12px;
    font-size: 20px;
    text-decoration: underline 20% #00aa00;
  }
  #nested span {
    font-size: 40px;
  }
  #vertical {
    left: 20px;
    top: 82px;
    font-size: 20px;
    writing-mode: vertical-rl;
    text-decoration: underline 0.3em #0000ff;
  }
  #scaled {
    left: 140px;
    top: 92px;
    font-size: 20px;
    text-decoration: line-through 3px #ff0000;
    transform: scale(2);
    transform-origin: 0 0;
  }
</style>
<div id="nested" class="case"><span>MMMM</span></div>
<div id="vertical" class="case">MMMM</div>
<div id="scaled" class="case">MMMM</div>
