<!doctype html>
<meta charset="utf-8">
<title>Render adjustment comparison</title>
<style>
  html, body { margin: 0; background: white; color: #102030; font: 16px/1.25 sans-serif; }
  main { padding: 16px; }
  .row { display: flex; gap: 18px; align-items: flex-start; }
  .box { width: 70px; height: 42px; padding: 4px; border: 2px solid #183a68; background: #9fd5ff; }
  #double { zoom: 2; }
  #nested-parent { zoom: 1.5; }
  #nested { zoom: 2; width: 36px; height: 22px; padding: 3px; border: 1px solid #742f1d; background: #ffbd92; }
  #economy, #exact { width: 110px; height: 34px; margin-top: 20px; padding: 4px; color: #f9f3e8; background: #68429a; }
  #economy { print-color-adjust: economy; }
  #exact { print-color-adjust: exact; }
  #hint { margin-top: 18px; width: 126px; padding: 4px; border-bottom: 3px solid #27824b; will-change: transform, opacity; }
</style>
<main>
  <div class="row">
    <div id="plain" class="box" data-probe>plain</div>
    <div id="double" class="box" data-probe>zoom 2</div>
    <div id="nested-parent" data-probe><div id="nested" data-probe>nested</div></div>
  </div>
  <div class="row">
    <div id="economy" data-probe>print economy</div>
    <div id="exact" data-probe>print exact</div>
  </div>
  <div id="hint" data-probe>will-change hint</div>
</main>
