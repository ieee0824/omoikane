<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0 }
  html, body { width: 100%; height: 100% }
  body { background: #101828 }
  #maximum-z-cover {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    background: #2255aa;
  }
  #popover {
    position: fixed;
    left: 40px;
    top: 30px;
    width: 80px;
    height: 60px;
    transform: none;
    border: 4px solid #ffffff;
    background: #ee3344;
  }
  #popover::backdrop { background: #22aa66 }
  #marker {
    width: 24px;
    height: 18px;
    margin: 12px;
    background: #ffdd22;
  }
</style>
<div id="maximum-z-cover"></div>
<div id="popover" popover="manual"><div id="marker"></div></div>
