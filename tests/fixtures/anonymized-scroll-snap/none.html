<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: white; }
  #scroller { width: 120px; height: 120px; overflow: auto; scrollbar-width: none;
              scroll-snap-type: none; }
  .tile { width: 120px; height: 120px; scroll-snap-align: start; }
  .first { background: #cc4444; }
  .second { background: #44cc44; }
  .third { background: #4444cc; }
</style>
<div id="scroller">
  <div class="tile first"></div>
  <div class="tile second"></div>
  <div class="tile third"></div>
</div>
<script>document.getElementById('scroller').scrollTo(0, 75);</script>
