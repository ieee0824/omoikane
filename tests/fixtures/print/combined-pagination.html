<!doctype html><html><head><style>
@page { size: 100px 60px; margin: 0 }
@page wide { size: 140px 60px; margin: 5px }
body, section { margin: 0 }
#intro { height: 20px; background: red }
#wide { page: wide; break-before: right }
#head { height: 15px; background: lime }
#keep { height: 40px; background: blue; break-inside: avoid-page; font: 10px/10px sans-serif; orphans: 1; widows: 1 }
#long { font: 10px/10px sans-serif; orphans: 2; widows: 2 }
table { width: 100px; border-spacing: 0 }
td { border: 0; padding: 0; font: 10px/20px sans-serif }
#tail { break-before: left; height: 10px; background: magenta }
</style></head><body>
<div id="intro"></div>
<section id="wide">
  <div id="head"></div>
  <div id="keep">ONE<br>TWO<br>THREE<br>FOUR</div>
  <div id="long">An ordinary paragraph with enough words to wrap across the narrower and wider printed page content areas and continue onto another page when its remaining space is small.</div>
  <table><tr><td>
    <span style="color:red">ROW-ONE</span><br><span style="color:yellow">ROW-TWO</span><br><span style="color:blue">ROW-THREE</span><br><span style="color:cyan">ROW-FOUR</span><br><span style="color:lime">ROW-FIVE</span>
  </td></tr></table>
  <div id="tail"></div>
</section>
</body></html>
