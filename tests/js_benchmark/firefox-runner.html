<!doctype html>
<meta charset="utf-8">
<title>Omoikane SpiderMonkey reference recorder</title>
<script src="shapes.js"></script>
<script>
  addEventListener("load", function () {
    try {
      // Emit a complete block only after every pass has validated its result.
      var output = runBenchmarks();
      dump("OMOIKANE_BENCH_BEGIN\n" + output + "\nOMOIKANE_BENCH_END\n");

      dump("OMOIKANE_BENCH_ERROR " + String(error) + "\n");

    window.close();
  });
</script>
