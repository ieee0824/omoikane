[package]
name = "omoikane"
version = "0.3.2"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
brotli = { version = "7", default-features = false, features = ["std"] }
boa_engine = { version = "0.21.0", features = ["annex-b"] }
flate2 = "1.1"
jpeg-decoder = "0.3"
png = "0.17"
rustls = "0.23"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
webpki-roots = "1.0"

[dev-dependencies]
boa_gc = "0.21.0"
rcgen = "0.13"

[build-dependencies]
cbindgen = "0.29"
