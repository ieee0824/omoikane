[package]
name = "omoikane"
version = "0.3.2"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
brotli = { version = "7", default-features = false, features = ["std"] }
boa_engine = { version = "0.21.0", features = ["annex-b"] }
flate2 = "1.1"
jpeg-decoder = "0.3"
png = "0.17"
rustls = "0.23"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
webpki-roots = "1.0"

[dev-dependencies]
boa_gc = "0.21.0"
rcgen = "0.13"

[build-dependencies]
cbindgen = "0.29"

# Pinned to a commit SHA (not the mutable branch) so the IC fix is reproducible
# and cannot silently change under us. rev 6b9778e is the fork's
# `omoikane/ic-fix-0.21.1` head: "fix(vm): guard prototype-property inline cache
# on the prototype's shape".
[patch.crates-io]
boa_engine = { git = "https://github.com/ieee0824/boa", rev = "6b9778e" }
boa_gc = { git = "https://github.com/ieee0824/boa", rev = "6b9778e" }
