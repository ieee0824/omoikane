[package]
name = "omoikane"
version = "0.3.2"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
gui = ["dep:softbuffer", "dep:winit"]
# Test-only Gate 2 comparison harness. This never selects a production
# JavaScript engine; it compares the existing Boa embedding with a standalone
# Boa interpreter context over the same source programs.
jit-differential = []
# Test-only Gate 3 substrate. Enabling this exposes Boa's native code-memory
# probe but does not select JIT execution for production JavaScript.
baseline-jit = ["boa_engine/baseline-jit"]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
brotli = { version = "7", default-features = false, features = ["std"] }
crc32fast = "1.5"
# Pinned to a specific revision so every fix it carries is reproducible and
# cannot silently change under us: the inline-cache guard (issues 057-059), the
# primitive property fast path (#313), appending to a string in place when a
# compound assignment owns it (#318, #319, #320), the collection threshold the
# profiling in #315 settled on, suspendable native host calls (#354), and
# registered roots for native builtin temporaries (ieee0824/boa#55),
# Array.prototype.filter callback rooting (ieee0824/boa#57), and
# nursery-bounded generational GC (ieee0824/boa#56), and
# defineProperty receiver/descriptor rooting (ieee0824/boa#58), and
# inline-cache hit rooting without weak-shape upgrades (ieee0824/boa#59),
# bounded polymorphic inline-cache shapes (ieee0824/boa#60), and
# Array.prototype.join/unshift receiver rooting during allocating property
# callbacks (ieee0824/boa#61), and the verified bytecode/JIT metadata contract
# (ieee0824/boa#62), and the allocation-free interpreter frame/fallback contract
# (ieee0824/boa#63), and the stable inline-cache state/telemetry contract
# (ieee0824/boa#64), and the opt-in x86_64 baseline-JIT code-memory/ABI
# substrate (ieee0824/boa#65), architecture-neutral baseline lowering and
# fallback (ieee0824/boa#66), arithmetic native execution
# (ieee0824/boa#67), and monomorphic property shape/slot native execution
# (ieee0824/boa#68). The pinned commit contains all listed fork changes.
boa_engine = { git = "https://github.com/ieee0824/boa", rev = "7c4d07f05f6f3dd5c138001c86c75c3e4012c6ea", features = ["annex-b"] }
boa_gc = { git = "https://github.com/ieee0824/boa", rev = "7c4d07f05f6f3dd5c138001c86c75c3e4012c6ea" }
flate2 = "1.1"
gif = "0.13"
getrandom = "0.3"
hmac = "0.12"
jpeg-decoder = "0.3"
png = "0.17"
rustls = "0.23"
rustybuzz = "0.20.1"
encoding_rs = "0.8"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
webpki-roots = "1.0"
image-webp = "0.2.4"
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.12", optional = true }

[[bin]]
name = "omoikane"
path = "src/bin/omoikane.rs"
required-features = ["gui"]

[dev-dependencies]
rcgen = "0.13"

[build-dependencies]
cbindgen = "0.29"

# Keep omoikane itself easy to debug while avoiding interpreter-heavy
# dependencies running completely unoptimized during real-site testing.
[profile.dev.package."*"]
opt-level = 2
