[package]
name = "omoikane"
version = "0.3.1"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
boa_engine = "0.21.0"
flate2 = "1.1"
jpeg-decoder = "0.3"
png = "0.17"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
webpki-roots = "1.0"

[dev-dependencies]
rcgen = "0.13"

[build-dependencies]
cbindgen = "0.29"
