[package]
name = "omoikane"
version = "0.1.0"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."

[dependencies]
base64 = "0.22"
boa_engine = "0.21.0"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
webpki-roots = "1.0"

[dev-dependencies]
rcgen = "0.13"
