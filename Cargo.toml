[package]
name = "omoikane"
version = "0.3.2"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
brotli = { version = "7", default-features = false, features = ["std"] }
crc32fast = "1.5"
# Pinned to the fork's `omoikane/ic-fix-0.21.1` head so the IC fix is
# reproducible and cannot silently change under us.
boa_engine = { git = "https://github.com/ieee0824/boa", rev = "4fc54b5c", features = ["annex-b"] }
flate2 = "1.1"
gif = "0.13"
jpeg-decoder = "0.3"
png = "0.17"
rustls = "0.23"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
webpki-roots = "1.0"

[dev-dependencies]
boa_gc = { git = "https://github.com/ieee0824/boa", rev = "4fc54b5c" }
rcgen = "0.13"

[build-dependencies]
cbindgen = "0.29"

# Keep omoikane itself easy to debug while avoiding interpreter-heavy
# dependencies running completely unoptimized during real-site testing.
[profile.dev.package."*"]
opt-level = 2
