[package]
name = "omoikane"
version = "0.3.2"
edition = "2024"
description = "A headless browser engine built from scratch in Rust."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
gui = ["dep:softbuffer", "dep:winit"]
# Test-only Gate 2 comparison harness. This never selects a production
# JavaScript engine; it compares the existing Boa embedding with a standalone
# Boa interpreter context over the same source programs.
jit-differential = []
# Test-only Gate 3 substrate. Enabling this exposes Boa's native code-memory
# probe but does not select JIT execution for production JavaScript.
baseline-jit = ["boa_engine/baseline-jit"]
# Gate 4 stress records automatic collections as well as generated execution.
jit-stress = ["baseline-jit", "boa_gc/gc-profile"]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
brotli = { version = "7", default-features = false, features = ["std"] }
crc32fast = "1.5"
# Source is maintained in engine/boa; engine/boa-origin.json records the
# imported revision and original file hashes. The inherited fixes include the
# inline-cache guard (issues 057-059), the
# primitive property fast path (#313), appending to a string in place when a
# compound assignment owns it (#318, #319, #320), the collection threshold the
# profiling in #315 settled on, suspendable native host calls (#354), and
# registered roots for native builtin temporaries (ieee0824/boa#55),
# Array.prototype.filter callback rooting (ieee0824/boa#57), and
# nursery-bounded generational GC (ieee0824/boa#56), and
# defineProperty receiver/descriptor rooting (ieee0824/boa#58), and
# inline-cache hit rooting without weak-shape upgrades (ieee0824/boa#59),
# bounded polymorphic inline-cache shapes (ieee0824/boa#60), and
# Array.prototype.join/unshift receiver rooting during allocating property
# callbacks (ieee0824/boa#61), and the verified bytecode/JIT metadata contract
# (ieee0824/boa#62), and the allocation-free interpreter frame/fallback contract
# (ieee0824/boa#63), and the stable inline-cache state/telemetry contract
# (ieee0824/boa#64), and the opt-in x86_64 baseline-JIT code-memory/ABI
# substrate (ieee0824/boa#65), architecture-neutral baseline lowering and
# fallback (ieee0824/boa#66), arithmetic native execution
# (ieee0824/boa#67), and monomorphic property shape/slot native execution
# (ieee0824/boa#68), baseline-JIT compile-cost diagnostics
# (ieee0824/boa#69), and JIT frame/safepoint/stack-map metadata
# (ieee0824/boa#70), the JIT runtime-call/allocation boundary
# (ieee0824/boa#72), and generational JIT frame root scanning
# (ieee0824/boa#73), and verified interpreter deoptimization
# (ieee0824/boa#75), collectible Realm prototype transitions
# (ieee0824/boa#77), and live generated-frame exception handling
# (ieee0824/boa#78), shared interpreter/JIT deadlines and async budgets
# (ieee0824/boa#79), live JIT code metadata snapshots (ieee0824/boa#80),
# safe deadline bookkeeping, job cancellation and module targets (ieee0824/boa#81),
# plus the focused Test262/ASAN CI diagnostics (ieee0824/boa#82)
# and bounded small-stack parsing in dev/release (ieee0824/boa#83),
# plus native ARM64 entry ABI, code memory (ieee0824/boa#84),
# ARM64 arithmetic lowering (ieee0824/boa#85), Promise resolution roots
# (ieee0824/boa#86), ARM64 property/helper lowering (ieee0824/boa#87),
# bounded JIT completion copies/property-binding scans (ieee0824/boa#88),
# and ASAN-independent native parser stack measurement (ieee0824/boa#89).
# The imported source contains all listed fork changes.
boa_engine = { path = "engine/boa/core/engine", features = ["annex-b"] }
boa_gc = { path = "engine/boa/core/gc" }
flate2 = "1.1"
gif = "0.13"
getrandom = "0.3"
hmac = "0.12"
jpeg-decoder = "0.3"
png = "0.17"
rustls = "0.23"
rustybuzz = "0.20.1"
encoding_rs = "0.8"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
webpki-roots = "1.0"
image-webp = "0.2.4"
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.12", optional = true }

[[bin]]
name = "omoikane"
path = "src/bin/omoikane.rs"
required-features = ["gui"]

[[example]]
name = "jit_release_probe"
required-features = ["baseline-jit"]

[dev-dependencies]
rcgen = "0.13"

[build-dependencies]
cbindgen = "0.29"

# Keep omoikane itself easy to debug while avoiding interpreter-heavy
# dependencies running completely unoptimized during real-site testing.
[profile.dev.package."*"]
opt-level = 2

# Conformance tests exercise thousands of native DOM calls per script. Give
# the host crate modest optimization too, while retaining the test profile's
# debug assertions and overflow checks. Normal development builds stay at O0.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
