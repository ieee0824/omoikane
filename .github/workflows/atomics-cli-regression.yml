name: CLI clock regression diagnostic

on:
  push:
    branches: [ci/issue515-atomics-timing]
    paths: ['.github/workflows/atomics-cli-regression.yml', 'scripts/diagnostics/issue657-cli.patch']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/engine/boa/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/boa -> target
          key: engine-clock-cli-aarch64
          cache-workspace-crates: true
      - name: Verify CLI clock regression fails before and passes after the fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root = Path.cwd()
          engine = root / 'engine/boa'
          out = root / '.artifacts/cli-clock'
          out.mkdir(parents=True)
          origin = json.loads((root / 'engine/boa-origin.json').read_text())
          files = ['core/engine/src/context/time.rs', 'core/engine/src/job.rs', 'cli/src/main.rs', 'examples/src/bin/smol_event_loop.rs', 'examples/src/bin/tokio_event_loop.rs']
          for name in files:
              assert hashlib.sha256((engine / name).read_bytes()).hexdigest() == origin['files'][name]['sha256']
          for patch in ['issue657-monotonic.patch', 'issue657-cli.patch']:
              subprocess.run(['git', 'apply', '--unidiff-zero', str(root / 'scripts/diagnostics' / patch)], check=True)
          identity = {'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'rustc': subprocess.check_output(['rustc', '-Vv'], text=True), 'source_sha256': {name: hashlib.sha256((engine / name).read_bytes()).hexdigest() for name in files}}
          (out / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          cli = engine / 'cli/src/main.rs'
          fixed = cli.read_text()
          assert fixed.count('clock().monotonic_now()') == 3
          cli.write_text(fixed.replace('clock().monotonic_now()', 'clock().now()'))
          (out / 'before.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          command = ['cargo', 'test', '--locked', '-p', 'boa_cli', '--bin', 'boa', 'cli_timeout_deadlines_ignore_wall_clock_adjustments', '--', '--exact', '--nocapture']
          # libtest uses the complete module path for exact selection.
          command[command.index('cli_timeout_deadlines_ignore_wall_clock_adjustments')] = 'tests::cli_timeout_deadlines_ignore_wall_clock_adjustments'
          with (out / 'before.log').open('w') as log:
              result = subprocess.run(command, cwd=engine, stdout=log, stderr=log)
          text = (out / 'before.log').read_text()
          assert result.returncode == 101 and 'test result: FAILED. 0 passed; 1 failed;' in text
          assert 'tests::cli_timeout_deadlines_ignore_wall_clock_adjustments' in text.rsplit('\nfailures:\n', 1)[1].split('\ntest result:', 1)[0]
          cli.write_text(fixed)
          (out / 'after.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          with (out / 'after.log').open('w') as log:
              subprocess.run(command, cwd=engine, stdout=log, stderr=log, check=True)
          assert 'test result: ok. 1 passed; 0 failed;' in (out / 'after.log').read_text()
          with (out / 'build.log').open('w') as log:
              subprocess.run(['cargo', 'build', '--locked', '-p', 'boa_cli', '-p', 'boa_examples', '--bin', 'boa', '--bin', 'smol_event_loop', '--bin', 'tokio_event_loop'], cwd=engine, stdout=log, stderr=log, check=True)
          subprocess.run(['cargo', 'fmt', '--all', '--check'], cwd=engine, check=True)
          (out / 'result.json').write_text(json.dumps({'before_failed': 1, 'after_passed': 1, 'build': 'passed', 'format': 'passed'}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-clock-regression
          path: .artifacts/cli-clock/
          if-no-files-found: error
