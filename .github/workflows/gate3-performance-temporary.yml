name: Gate 3 performance snapshot (temporary)

on:
  push:
    branches:
      - feat/issue533-performance-gate

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        jit: [off, on]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure five fresh runtimes
        shell: bash
        run: |
          mkdir -p .artifacts/gate3
          if [[ "${{ matrix.jit }}" == on ]]; then
            features=(--features baseline-jit)
          else
            features=()
          fi
          OMOIKANE_JS_BENCH_RUNS=5 \
          OMOIKANE_BENCH_REVISION="${GITHUB_SHA}" \
          OMOIKANE_BENCH_ENVIRONMENT="${{ matrix.os }} jit-${{ matrix.jit }} GitHub Actions" \
          OMOIKANE_JS_BENCH_REPORT=".artifacts/gate3/${{ matrix.os }}-jit-${{ matrix.jit }}.json" \
          cargo test "${features[@]}" --test js_benchmark \
            js_execution_benchmark_reports_every_shape -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: gate3-${{ matrix.os }}-jit-${{ matrix.jit }}
          path: .artifacts/gate3/*.json
