name: JIT release gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jit-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  prepare:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rerun selection and incomplete or mismatched evidence cannot pass
        run: |
          python3 -m unittest discover -s scripts/tests -p test_select_gate_artifacts.py
          python3 -m unittest discover -s scripts/tests -p test_jit_gate5.py
      - name: Resolve one dependency set for all six jobs
        run: python3 scripts/jit-gate5.py prepare .artifacts/jit-gate5/inputs
      - uses: actions/upload-artifact@v4
        with:
          name: jit-gate5-inputs
          path: .artifacts/jit-gate5/inputs/
          if-no-files-found: error

  target:
    needs: prepare
    name: Gate 5 (${{ matrix.target }}, ${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [suite, package]
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: omoikane-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: omoikane-linux-aarch64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: omoikane-macos-aarch64.tar.gz
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: jit-gate5-inputs
          path: .artifacts/jit-gate5/inputs/
      - name: Use the shared lockfile
        run: cp .artifacts/jit-gate5/inputs/Cargo.lock Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          # A failed suite may leave an incomplete cache at a permanent key.
          # Refresh the existing entries and save only after successful jobs.
          key: jit-gate5-v3-${{ matrix.target }}-${{ matrix.kind }}
          cache-workspace-crates: true
      # rust-cache sees only the root workspace and drops the nested Boa path
      # dependencies from target/debug. Restore them after rust-cache cleanup.
      - name: Restore Boa suite artifacts
        if: matrix.kind == 'suite'
        id: boa-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug/.fingerprint/boa_*
            target/debug/build/boa_*
            target/debug/deps/boa_*
            target/debug/deps/libboa_*
          key: boa-gate5-v1-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.github/workflows/jit-release-gate.yml', 'engine/boa/Cargo.lock', 'engine/boa/**/Cargo.toml', 'engine/boa/**/*.rs') }}
      - uses: actions/cache@v4
        if: matrix.kind == 'suite'
        with:
          path: .cache/wpt
          key: wpt-${{ hashFiles('tests/wpt/revision.txt') }}
      - name: Install Linux system fonts
        if: runner.os == 'Linux' && matrix.kind == 'suite'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto-core
      - name: Run full suite or build and smoke-test the release archive
        env:
          GATE_KIND: ${{ matrix.kind }}
          GATE_TARGET: ${{ matrix.target }}
          CARGO_LOG: ${{ matrix.target == 'aarch64-apple-darwin' && matrix.kind == 'suite' && 'cargo::core::compiler::fingerprint=info' || '' }}
        run: python3 scripts/jit-gate5.py "$GATE_KIND" "$GATE_TARGET" .artifacts/jit-gate5
      - name: Save Boa suite artifacts
        if: matrix.kind == 'suite' && steps.boa-cache.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug/.fingerprint/boa_*
            target/debug/build/boa_*
            target/debug/deps/boa_*
            target/debug/deps/libboa_*
          key: boa-gate5-v1-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.github/workflows/jit-release-gate.yml', 'engine/boa/Cargo.lock', 'engine/boa/**/Cargo.toml', 'engine/boa/**/*.rs') }}
      - name: Upload the verified distribution archive
        if: matrix.kind == 'package'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: .artifacts/jit-gate5/${{ matrix.target }}/package/${{ matrix.archive }}
          if-no-files-found: error
      - name: Retain execution, benchmark and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-gate5-${{ matrix.target }}-${{ matrix.kind }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/jit-gate5/
            !.artifacts/jit-gate5/inputs/**
            !.artifacts/jit-gate5/**/staging/**
            !.artifacts/jit-gate5/**/extracted/**
            !.artifacts/jit-gate5/**/*.tar.gz
          if-no-files-found: error

  gate:
    name: Gate 5 aggregate
    needs: [changes, prepare, target]
    if: always() && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jit-gate5-inputs
          path: .artifacts/jit-gate5/inputs/
      - uses: actions/download-artifact@v4
        with:
          pattern: jit-gate5-*-attempt-*
          path: .artifacts/gate5-attempts/
      - name: Select the latest attempt for each target and kind
        run: >-
          python3 scripts/select-gate-artifacts.py
          .artifacts/gate5-attempts
          .artifacts/jit-gate5
          --prefix jit-gate5-
      - name: Require all targets, compatibility reports and actual native execution
        if: always()
        env:
          GATE_JOBS_RESULT: ${{ needs.target.result }}
        run: python3 scripts/jit-gate5.py aggregate .artifacts/jit-gate5 --jobs-result "$GATE_JOBS_RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-gate5-report
          path: .artifacts/jit-gate5/gate.json
          if-no-files-found: error
