name: Change scope

on:
  workflow_call:
    outputs:
      run_full:
        value: ${{ jobs.classify.outputs.run_full }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify change classification
        run: python3 -m unittest discover -s scripts/tests -p test_ci_change_scope.py
      - name: Classify changed files
        id: scope
        env:
          CI_AUTH: ${{ github.token }}
        run: python3 scripts/ci-change-scope.py
