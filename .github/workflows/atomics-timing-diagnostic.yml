name: Atomics timing diagnostic
run-name: Atomics clock regression and timing (${{ github.sha }})

on:
  push:
    branches: [ci/issue515-atomics-timing]
    paths: ['.github/workflows/atomics-timing-diagnostic.yml', 'scripts/diagnose-atomics-timing.py', 'scripts/diagnostics/issue657-monotonic.patch']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Atomics timing (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/engine/boa/target
      RUST_MIN_STACK: '8388608'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/boa -> target
          key: engine-test262-v1-${{ matrix.target }}-current
          cache-workspace-crates: true
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: a073f479f80b336256b7fc4e04700c827293e2fe
          path: test262
          persist-credentials: false
      - name: Record repeated original failures, detailed assertions and clock measurements
        run: python3 scripts/diagnose-atomics-timing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomics-timing-${{ matrix.target }}
          path: .artifacts/atomics-timing/
          if-no-files-found: error
