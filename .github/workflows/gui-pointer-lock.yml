name: GUI Pointer Lock

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'engine/**', 'Cargo.toml', 'Cargo.lock', 'tests/fixtures/anonymized-pointer-lock/**', 'scripts/test-pointer-lock-x11.py', 'scripts/gui_x11.py', 'scripts/test-gui-x11.py', 'scripts/test-gui-render-demand.py', 'scripts/test-gui-scroll.py', 'tests/fixtures/gui-scroll/**', 'tests/fixtures/gui-render-demand/**', 'scripts/tests/test_gui_x11.py', 'scripts/test-gui-url-entry.py', 'scripts/gui_navigation_fixture.py', 'scripts/tests/test_gui_url_entry.py', 'scripts/tests/test_gui_navigation_fixture.py', 'tests/fixtures/gui-navigation/**', '.github/workflows/gui-pointer-lock.yml']
  push:
    branches: [main]
    paths: ['src/**', 'engine/**', 'Cargo.toml', 'Cargo.lock', 'tests/fixtures/anonymized-pointer-lock/**', 'scripts/test-pointer-lock-x11.py', 'scripts/gui_x11.py', 'scripts/test-gui-x11.py', 'scripts/test-gui-render-demand.py', 'scripts/test-gui-scroll.py', 'tests/fixtures/gui-scroll/**', 'tests/fixtures/gui-render-demand/**', 'scripts/tests/test_gui_x11.py', 'scripts/test-gui-url-entry.py', 'scripts/gui_navigation_fixture.py', 'scripts/tests/test_gui_url_entry.py', 'scripts/tests/test_gui_navigation_fixture.py', 'tests/fixtures/gui-navigation/**', '.github/workflows/gui-pointer-lock.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-pointer-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  x11:
    name: Pointer Lock X11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-pointer-lock-${{ runner.arch }}
          cache-workspace-crates: true
      - name: Install virtual desktop and input tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool x11-utils openbox libxkbcommon-x11-0 python3-pil fonts-dejavu
      - name: Build and test GUI bridge
        run: |
          cargo build --locked --features gui --bin omoikane
          cargo test --locked --features gui --bin omoikane
      - name: Verify harness failure cleanup and scaled native hit testing
        run: |
          /usr/bin/python3 -m unittest discover -s scripts/tests -p test_gui_x11.py
          /usr/bin/python3 scripts/test-gui-x11.py --binary target/debug/omoikane --artifacts .artifacts/gui-scale
      - name: Verify URL entry navigates and paints the destination (#1131)
        run: |
          /usr/bin/python3 -m unittest discover -s scripts/tests -p test_gui_url_entry.py
          /usr/bin/python3 -m unittest discover -s scripts/tests -p test_gui_navigation_fixture.py
          /usr/bin/python3 scripts/test-gui-url-entry.py --binary target/debug/omoikane --artifacts .artifacts/gui-url-entry
      - name: Verify a stale destination page is not accepted
        run: |
          set +e
          /usr/bin/python3 scripts/test-gui-url-entry.py --binary target/debug/omoikane --artifacts .artifacts/gui-url-entry-negative --negative stale-page
          status=$?
          set -e
          test "$status" -eq 1 || { echo "expected REGRESSION (1), got $status"; exit 1; }
      - name: Verify native X11 input and cursor lifecycle
        run: /usr/bin/python3 scripts/test-pointer-lock-x11.py --binary target/debug/omoikane --artifacts .artifacts/gui-pointer-lock
      - name: Verify idle paints and real animation deadlines
        run: /usr/bin/python3 scripts/test-gui-render-demand.py --verify --binary target/debug/omoikane --artifacts .artifacts/gui-render-demand
      - name: Verify continuous wheel rendering at both device scales
        run: |
          /usr/bin/python3 scripts/test-gui-scroll.py --binary target/debug/omoikane --scale 1 --artifacts .artifacts/gui-scroll-1
          /usr/bin/python3 scripts/test-gui-scroll.py --binary target/debug/omoikane --scale 2 --artifacts .artifacts/gui-scroll-2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-pointer-lock-${{ runner.arch }}
          path: |
            .artifacts/gui-pointer-lock/
            .artifacts/gui-scale/
            .artifacts/gui-render-demand/
            .artifacts/gui-scroll-1/
            .artifacts/gui-scroll-2/
            .artifacts/gui-url-entry/
            .artifacts/gui-url-entry-negative/
          include-hidden-files: true
          if-no-files-found: error
