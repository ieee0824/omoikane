name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the repository crate artifacts as well as dependencies so a
          # PR rerun can reuse an unchanged Omoikane build. Bump shared-key
          # when the cache policy changes to avoid restoring dependency-only
          # entries produced by the old configuration.
          shared-key: workspace-v1
          cache-workspace-crates: true
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto-core
      - name: Run all tests (including ignored)
        run: cargo test -- --include-ignored
      - run: cargo build


  wpt-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-v1
          cache-workspace-crates: true
      - uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ hashFiles('tests/wpt/revision.txt') }}
      - name: Fetch pinned WPT subset
        env:
          WPT_ROOT: .cache/wpt
        run: scripts/fetch-wpt.sh
      - name: Run WPT smoke subset
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
          WPT_REPORT: .artifacts/wpt/report.json
          WPT_JUNIT: .artifacts/wpt/junit.xml
        run: cargo test --test wpt_smoke -- --nocapture
      - name: Upload WPT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-smoke-report
          path: .artifacts/wpt/
          if-no-files-found: error
