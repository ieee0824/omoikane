name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  format:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Test formatting failure detection
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_rustfmt.py'
      - name: Test GUI navigation fixture
        run: python3 -m unittest discover -s scripts/tests -p 'test_gui_navigation_fixture.py'
      - name: Test WPT fixture listener ownership
        run: python3 -m unittest discover -s scripts/tests -p 'test_wptserve_startup.py'
      - name: Verify root crate formatting
        run: python3 scripts/check_rustfmt.py

  normal-test-prepare:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Verify Cargo guard and complete default test partitioning
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_cargo_space_guard.py'
          python3 -m unittest discover -s scripts/tests -p 'test_ci_test_partitions.py'
          python3 -m unittest discover -s scripts/tests -p 'test_benchmark_reference.py'
          python3 -m unittest discover -s scripts/tests -p 'test_select_gate_artifacts.py'
      - name: Record one source, lockfile and complete Cargo target inventory
        run: |
          set -euo pipefail
          test "$(rustc --version --verbose | awk '/^host:/ {print $2}')" = x86_64-unknown-linux-gnu
          python3 scripts/ci-test-partitions.py prepare .artifacts/normal-test-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: normal-test-inputs-attempt-${{ github.run_attempt }}
          path: .artifacts/normal-test-inputs/
          if-no-files-found: error

  normal-test-partition:
    needs: normal-test-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../normal-test-target
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        partition: [unit-build, integration-0, integration-1, integration-2, integration-3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/download-artifact@v4
        with:
          pattern: normal-test-inputs-attempt-*
          path: .artifacts/normal-test-input-attempts
      - name: Select latest prepared source without discarding prior evidence
        run: |
          mkdir -p .artifacts/normal-test-results
          python3 scripts/select-gate-artifacts.py .artifacts/normal-test-input-attempts .artifacts/normal-test-inputs --prefix normal-test- > .artifacts/normal-test-results/input-${{ matrix.partition }}-selection.json
      - name: Reclaim only the unused Android SDK on the hosted normal test runner
        run: python3 scripts/ci-test-partitions.py clean-runner-sdk .artifacts/normal-test-results/space-${{ matrix.partition }}
      - name: Record capacity before cache lookup
        run: python3 scripts/ci-test-partitions.py space .artifacts/normal-test-results/space-${{ matrix.partition }} before-cache
      - name: Bind the empty target before checking the existing Cargo cache
        run: |
          python3 scripts/cargo-space-guard.py run --required-free-gib 2 --maximum-target-gib 10 -- true
          python3 scripts/ci-test-partitions.py save-cache-binding .artifacts/normal-test-results/space-${{ matrix.partition }}/target-binding.json
      - uses: Swatinem/rust-cache@v2
        id: normal-cache
        with:
          # Keep #1451's one main-only writer. Integration jobs restore only.
          shared-key: workspace-v2
          workspaces: ". -> ../normal-test-target"
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 'unit-build' }}
          cache-workspace-crates: true
          # Do not expand an unbounded old archive outside the capacity guard.
          # Preserve the existing key and main-only writer for sibling jobs.
          lookup-only: true
      - name: Record capacity after cache lookup
        env:
          OMOIKANE_CI_CACHE_HIT: ${{ steps.normal-cache.outputs.cache-hit }}
        run: python3 scripts/ci-test-partitions.py space .artifacts/normal-test-results/space-${{ matrix.partition }} after-cache
      # A partial cache hit cleans root metadata. Restore only the binding saved
      # before that known cache operation, then repeat all guard checks.
      - name: Restore guard metadata after cache maintenance and recheck ownership
        run: |
          python3 scripts/ci-test-partitions.py restore-cache-binding .artifacts/normal-test-results/space-${{ matrix.partition }}/target-binding.json
          python3 scripts/cargo-space-guard.py run --required-free-gib 2 --maximum-target-gib 10 -- true
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto-core fonts-noto-cjk
      - name: Record capacity after fonts
        run: python3 scripts/ci-test-partitions.py space .artifacts/normal-test-results/space-${{ matrix.partition }} after-fonts
      - name: Run exact default test partition with capacity guard
        run: python3 scripts/ci-test-partitions.py run ${{ matrix.partition }} .artifacts/normal-test-inputs .artifacts/normal-test-results/${{ matrix.partition }}
      - name: Record final capacity even when a partition failed
        if: always()
        run: python3 scripts/ci-test-partitions.py space .artifacts/normal-test-results/space-${{ matrix.partition }} after-partition
      - name: Upload every partition log, source input, report and painted frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-test-part-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: .artifacts/normal-test-results/
          if-no-files-found: error

  # Preserve the existing check name: it becomes green only after every default
  # target, compile-only example, doc test, Gate2 and locked build is evidenced.
  test:
    needs: [normal-test-prepare, normal-test-partition]
    if: always() && needs.normal-test-prepare.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/download-artifact@v4
        with:
          pattern: normal-test-inputs-attempt-*
          path: .artifacts/normal-test-input-attempts
      - uses: actions/download-artifact@v4
        with:
          pattern: normal-test-part-*
          path: .artifacts/normal-test-part-attempts
      - name: Select latest attempt per partition while retaining failed evidence
        run: |
          mkdir -p .artifacts/normal-test-aggregate
          python3 scripts/select-gate-artifacts.py .artifacts/normal-test-input-attempts .artifacts/normal-test-inputs --prefix normal-test- > .artifacts/normal-test-aggregate/inputs-selection.json
          python3 scripts/select-gate-artifacts.py .artifacts/normal-test-part-attempts .artifacts/normal-test-results --prefix normal-test-part- > .artifacts/normal-test-aggregate/partitions-selection.json
      - name: Require complete execution and preserve the unique JS benchmark
        run: python3 scripts/ci-test-partitions.py aggregate .artifacts/normal-test-inputs .artifacts/normal-test-results .artifacts/normal-test-aggregate --partition-job-result ${{ needs.normal-test-partition.result }}
      - name: Report JS execution benchmark
        run: python3 scripts/report-js-benchmark.py .artifacts/js-benchmark/report.json
      - name: Upload JS benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-benchmark-report-attempt-${{ github.run_attempt }}
          path: .artifacts/js-benchmark/
          if-no-files-found: error
      - name: Upload browser logs, reports and painted frames by partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-x86_64-unknown-linux-gnu-interpreter-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/normal-test-results/
            .artifacts/normal-test-aggregate/
          if-no-files-found: error

  gate4-prepare:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Verify partitioning, rerun selection and gate aggregation
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_jit_gate4.py'
          python3 -m unittest discover -s scripts/tests -p 'test_select_gate_artifacts.py'
      - name: Define fixed gate partitions
        id: matrix
        run: echo "shards=$(python3 scripts/jit-gate4.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Resolve one dependency lockfile for every partition
        run: python3 scripts/jit-gate4.py prepare .artifacts/js-benchmark/gate4/inputs
      - uses: actions/upload-artifact@v4
        with:
          name: jit-gate4-inputs
          path: .artifacts/js-benchmark/gate4/inputs/
          if-no-files-found: error

  gate4-partition:
    needs: gate4-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # An Acid3 failure must not cancel the ten-minute stress or other suites.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.gate4-prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/download-artifact@v4
        with:
          name: jit-gate4-inputs
          path: .artifacts/js-benchmark/gate4/inputs
      - name: Use the shared dependency lockfile
        run: cp .artifacts/js-benchmark/gate4/inputs/Cargo.lock Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          # Every partition builds with the same features and dependencies.
          # The integration partition builds all of them (tests, examples,
          # bins and docs), so only it writes the shared entry, on main and
          # after a successful run (#1451). Omoikane itself is rebuilt for
          # each revision in every partition either way.
          shared-key: gate4-parallel-v2
          save-if: ${{ matrix.shard == 'integration' && github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
      - uses: actions/cache@v4
        if: matrix.shard == 'compatibility' || matrix.shard == 'integration'
        with:
          path: .cache/wpt
          key: wpt-${{ hashFiles('tests/wpt/revision.txt') }}
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto-core fonts-noto-cjk
      - name: Fetch WPT references for integration tests
        if: matrix.shard == 'integration'
        env:
          WPT_ROOT: .cache/wpt
        run: scripts/fetch-wpt.sh
      - name: Run gate partition
        env:
          GATE_SHARD: ${{ matrix.shard }}
        run: python3 scripts/jit-gate4.py run "$GATE_SHARD" .artifacts/js-benchmark/gate4
      - name: Upload partition results and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-gate4-partition-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .artifacts/js-benchmark/
          if-no-files-found: error
      - name: Upload upstream WPT server diagnostics
        if: always() && matrix.shard == 'compatibility'
        uses: actions/upload-artifact@v4
        with:
          name: jit-gate4-wptserve-attempt-${{ github.run_attempt }}
          path: .artifacts/wptserve/
          if-no-files-found: warn

  # Preserve the existing required-check name; missing/failed partitions are no-go.
  jit-stress:
    needs: [changes, gate4-prepare, gate4-partition]
    if: always() && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jit-gate4-partition-*-attempt-*
          path: .artifacts/gate4-attempts/
      - name: Select the latest attempt for each partition
        run: >-
          python3 scripts/select-gate-artifacts.py
          .artifacts/gate4-attempts
          .artifacts/js-benchmark
          --prefix jit-gate4-partition-
      - name: Require the full gate across all partitions
        if: always()
        env:
          GATE_JOBS_RESULT: ${{ needs.gate4-partition.result }}
        run: python3 scripts/jit-gate4.py aggregate .artifacts/js-benchmark/gate4 --jobs-result "$GATE_JOBS_RESULT"
      - name: Upload combined gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-gate4-report
          path: .artifacts/js-benchmark/gate4/gate.json
          if-no-files-found: error

  wpt-smoke:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    # Same image as `test`, whose cache entry this job restores.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore-only: `test` writes the shared entry (#1451).
          shared-key: workspace-v2
          save-if: false
          cache-workspace-crates: true
      - uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ hashFiles('tests/wpt/revision.txt') }}
      - name: Fetch pinned WPT subset
        env:
          WPT_ROOT: .cache/wpt
        run: scripts/fetch-wpt.sh
      - name: Verify generated event handler inventory
        run: python3 scripts/generate-event-handler-inventory.py --wpt-root .cache/wpt --check
      - name: Run WPT smoke subset
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
          WPT_REPORT: .artifacts/wpt/report.json
          WPT_JUNIT: .artifacts/wpt/junit.xml
        run: cargo test --locked --test wpt_smoke -- --nocapture
      - name: Run Storage Access insecure-context WPTs over upstream HTTP
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
          WPT_MANIFEST: tests/wpt/storage-access-insecure.json
          WPT_REPORT: .artifacts/wpt/storage-access-insecure-report.json
          WPT_JUNIT: .artifacts/wpt/storage-access-insecure-junit.xml
        run: cargo test --locked --test wpt_smoke selected_wpt_testharness_cases_match_expectations -- --exact --nocapture
      - name: Run individual transform reftests
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
        run: cargo test --locked --test p1_transform_reftests -- --nocapture
      - name: Run media query reftests
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
        run: cargo test --locked --test p1_media_reftests -- --nocapture
      - name: Run printed page layer reftests
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
        run: cargo test --locked --test print_page_wpt -- --nocapture
      - name: Upload WPT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-smoke-report
          path: .artifacts/wpt/
          if-no-files-found: error
