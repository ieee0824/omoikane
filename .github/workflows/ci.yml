name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto-core
      - name: Run all tests (including ignored)
        run: cargo test -- --include-ignored
      - run: cargo build


  wpt-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ hashFiles('tests/wpt/revision.txt') }}
      - name: Fetch pinned WPT subset
        env:
          WPT_ROOT: .cache/wpt
        run: scripts/fetch-wpt.sh
      - name: Run WPT smoke subset
        env:
          WPT_ROOT: .cache/wpt
        run: cargo test --test wpt_smoke -- --nocapture
