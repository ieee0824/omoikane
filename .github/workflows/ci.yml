name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the repository crate artifacts as well as dependencies so a
          # PR rerun can reuse an unchanged Omoikane build. Bump this key
          # when the cache policy changes to avoid restoring dependency-only
          # entries produced by the old configuration.
          key: workspace-v1
          cache-workspace-crates: true
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation fonts-noto-core
      - name: Run all tests (including ignored)
        run: cargo test -- --include-ignored
      - name: Run Gate 2 differential harness
        run: cargo test --features jit-differential --test jit_differential

      - name: Run Gate 3 code-memory contract
        run: cargo test --features baseline-jit --test jit_code_memory
      - name: Run Gate 3 baseline-lowering contract
        run: cargo test --features baseline-jit --test jit_baseline_lowering
      - name: Run Gate 3 arithmetic native-execution contract
        run: cargo test --features baseline-jit --test jit_arithmetic
      - name: Run Gate 4 JIT stack-map contract
        run: cargo test --features baseline-jit --test jit_stack_map
      - name: Run Gate 4 JIT runtime-call contract
        run: cargo test --features baseline-jit --test jit_runtime_call
      - name: Run Gate 4 generational JIT-root contract
        run: cargo test --features baseline-jit --test jit_gc_roots
      - run: cargo build
      # Re-run the JS benchmark with output shown: libtest swallows stdout for
      # passing tests, so the per-shape table and the drift classification would
      # otherwise never be visible. The build is already warm from the step
      # above and the benchmark itself takes about a second.
      - name: Report JS execution benchmark
        env:
          OMOIKANE_JS_BENCH_REPORT: .artifacts/js-benchmark/report.json
        run: cargo test --test js_benchmark -- --nocapture
      - name: Upload JS benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-benchmark-report
          path: .artifacts/js-benchmark/
          if-no-files-found: error


  wpt-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-v1
          cache-workspace-crates: true
      - uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ hashFiles('tests/wpt/revision.txt') }}
      - name: Fetch pinned WPT subset
        env:
          WPT_ROOT: .cache/wpt
        run: scripts/fetch-wpt.sh
      - name: Run WPT smoke subset
        env:
          WPT_ROOT: .cache/wpt
          WPT_REQUIRED: "1"
          WPT_REPORT: .artifacts/wpt/report.json
          WPT_JUNIT: .artifacts/wpt/junit.xml
        run: cargo test --test wpt_smoke -- --nocapture
      - name: Upload WPT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-smoke-report
          path: .artifacts/wpt/
          if-no-files-found: error
