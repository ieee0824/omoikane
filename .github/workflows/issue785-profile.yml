name: Issue 785 x86 profile (temporary)

on:
  push:
    branches: [perf/issues785-825, ci/issue785-comparison]

jobs:
  acid3-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Measure unmodified main on the same x86_64 runner
        env:
          OMOIKANE_JIT_GATE_REPORT_DIR: .artifacts/issue785-profile/baseline
        run: |
          mkdir -p .artifacts/issue785-profile/baseline
          git checkout --detach f65700e
          set +e
          cargo test --locked --features jit-stress,jit-differential \
            --test acid3_harness runner_scores_100_in_both_drive_modes \
            -- --nocapture --test-threads=1 2>&1 | tee .artifacts/issue785-profile/baseline/acid3.log
          baseline_acid3_status=${PIPESTATUS[0]}
          cargo test --locked --features jit-stress,jit-differential \
            --test attribute_records_gc -- --nocapture --test-threads=1 \
            2>&1 | tee .artifacts/issue785-profile/baseline/attribute_records_gc.log
          baseline_attribute_status=${PIPESTATUS[0]}
          set -e
          printf 'acid3=%s\nattribute_records_gc=%s\n' "$baseline_acid3_status" "$baseline_attribute_status" \
            > .artifacts/issue785-profile/baseline/status.txt
          git checkout --detach "$GITHUB_SHA"
      - name: Measure optimized behavior without profiling on the same x86_64 runner
        env:
          OMOIKANE_JIT_GATE_REPORT_DIR: .artifacts/issue785-profile/optimized-normal
        run: |
          mkdir -p .artifacts/issue785-profile/optimized-normal
          cargo test --locked --features jit-stress,jit-differential \
            --test acid3_harness runner_scores_100_in_both_drive_modes \
            -- --nocapture --test-threads=1 \
            2>&1 | tee .artifacts/issue785-profile/optimized-normal/acid3.log
      - name: Profile test26 on x86_64
        env:
          OMOIKANE_ACID3_PROFILE_26: '1'
          OMOIKANE_JIT_GATE_REPORT_DIR: .artifacts/issue785-profile/optimized-profile
        run: |
          mkdir -p .artifacts/issue785-profile/optimized-profile
          cargo test --locked --features jit-stress,jit-differential \
            --test acid3_harness runner_scores_100_in_both_drive_modes \
            -- --nocapture --test-threads=1 2>&1 | tee .artifacts/issue785-profile/optimized-profile/acid3.log
      - name: Measure attribute record regression on x86_64
        run: |
          cargo test --locked --features jit-stress,jit-differential \
            --test attribute_records_gc -- --nocapture --test-threads=1 \
            2>&1 | tee .artifacts/issue785-profile/optimized-normal/attribute_records_gc.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue785-profile-${{ github.sha }}
          path: .artifacts/issue785-profile/
          if-no-files-found: warn
