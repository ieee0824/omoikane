name: Native JIT targets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue1506_pair:
        description: Run only the fixed Issue1506 paired diagnostic on one native Mac
        type: boolean
        default: false
      macos_wpt_diagnostics:
        description: Run an additional Apple Silicon WPT AddressSanitizer diagnostic
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: native-jit-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.issue1506_pair && format('issue1506-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.issue1506_pair) }}

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  native:
    needs: changes
    if: needs.changes.outputs.run_full == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.issue1506_pair)
    name: Native JIT (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-jit-v1-${{ matrix.target }}
          # PRs restore main's entry; see #1451 for the cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify the native host and record the revision
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/jit-native
          {
            uname -a
            rustc --version --verbose
            git show --no-patch --format=fuller HEAD
            echo "expected_target=$EXPECTED_TARGET"
          } > .artifacts/jit-native/environment.txt
          actual=$(rustc --version --verbose | awk '/^host:/ {print $2}')
          test "$actual" = "$EXPECTED_TARGET"
          test "$(uname -m | sed 's/^arm64$/aarch64/')" = "${EXPECTED_TARGET%%-*}"
      - name: Run native JIT, GC, deopt, exception and timeout contracts
        shell: bash
        run: bash scripts/check-jit-native.sh
      - name: Upload execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-native-${{ matrix.target }}
          path: .artifacts/jit-native/
          if-no-files-found: error

  macos-wpt-asan:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_wpt_diagnostics && !inputs.issue1506_pair
    name: Diagnostic WPT ASan (aarch64-apple-darwin)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify diagnostic command and failure evidence handling
        run: python3 -m unittest discover -s scripts/tests -p test_diagnose_macos_wpt_asan.py
      - name: Run independent WPT ASan diagnostic
        run: >-
          python3 scripts/diagnose-macos-wpt-asan.py
          .artifacts/macos-wpt-asan
          --target-dir "${{ runner.temp }}/omoikane-wpt-asan"
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-wpt-asan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/macos-wpt-asan/
            .artifacts/wptserve/
          if-no-files-found: error

  issue1506-pair:
    if: github.event_name == 'workflow_dispatch' && inputs.issue1506_pair
    name: Issue1506 fixed paired diagnostic (single native Mac allocation)
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Check diagnostic source invariants
        run: python3 scripts/test_issue1506_pair.py > "$RUNNER_TEMP/issue1506-pair-unit.log" 2>&1
      - name: Run both fixed sources and preserve failures
        run: python3 scripts/run-issue1506-pair.py --allocation "$RUNNER_TEMP/issue1506-pair" --execute
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1506-native-mac-pair
          path: |
            ${{ runner.temp }}/issue1506-pair/result.json
            ${{ runner.temp }}/issue1506-pair/host-*.log
            ${{ runner.temp }}/issue1506-pair/*-observer-applied.patch
            ${{ runner.temp }}/issue1506-pair/logs/
            scripts/issue1506-pair-spec.json
            scripts/issue1506-observer.patch
            scripts/diagnose-issue1506-pair.py
            scripts/run-issue1506-pair.py
            scripts/test_issue1506_pair.py
            .github/workflows/jit-native.yml
            ${{ runner.temp }}/issue1506-pair/preflight.json
            ${{ runner.temp }}/issue1506-pair-unit.log
          if-no-files-found: error
