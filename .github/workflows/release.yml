name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  jit-native:
    uses: ./.github/workflows/jit-native.yml
    permissions:
      contents: read

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libomoikane.so
            archive: omoikane-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            lib: libomoikane.so
            archive: omoikane-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            lib: libomoikane.dylib
            archive: omoikane-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            lib: libomoikane.dylib
            archive: omoikane-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} dist/
          cp include/omoikane.h dist/
          tar czf ${{ matrix.archive }} -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: [build, jit-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omoikane-*.tar.gz
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
