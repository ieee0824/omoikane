name: Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  jit-native:
    # PRs already run this matrix in jit-native.yml. Keep it mandatory for
    # tagged releases and manual release preflights.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/jit-native.yml
    permissions:
      contents: read

  build:
    uses: ./.github/workflows/jit-release-gate.yml
    permissions:
      contents: read

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, jit-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omoikane-*.tar.gz
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
